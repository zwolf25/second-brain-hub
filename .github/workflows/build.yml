name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A docs-only push must not rebuild the already-released version tag.
    paths-ignore: ["*.md"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # `tauri-action` builds and publishes a signed release (installers +
  # updater's `latest.json` manifest) in one step per platform — it uploads
  # directly to GitHub Release assets via the API, not through
  # actions/upload-artifact's blob storage, so it doesn't hit the
  # Zscaler-blocked artifact-storage domain that forced the old
  # build-then-separately-publish two-job workflow. Both platform jobs target
  # the same release tag; the action handles concurrent asset uploads to one
  # release safely (its documented multi-platform pattern), so no manual
  # job-sequencing is needed like the old workflow required.
  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      # RELEASE_NOTES.md is rewritten each release (hub-release skill); it becomes the Release body and the updater's `notes`.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat RELEASE_NOTES.md
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Second Brain Hub v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
