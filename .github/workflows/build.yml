name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A docs-only push must not rebuild the already-released version tag.
    paths-ignore: ["*.md"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # `tauri-action` builds and publishes signed installers per platform (the `manifest` job below writes `latest.json`) — it uploads
  # directly to GitHub Release assets via the API, not through
  # actions/upload-artifact's blob storage, so it doesn't hit the
  # Zscaler-blocked artifact-storage domain that forced the old
  # build-then-separately-publish two-job workflow. Both platform jobs target
  # the same release tag; the action handles concurrent asset uploads to one
  # release safely (its documented multi-platform pattern), so no manual
  # job-sequencing is needed like the old workflow required.
  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: no known user yet, built so the first one can still install and auto-update.
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      # RELEASE_NOTES.md is rewritten each release (hub-release skill); it becomes the Release body and the updater's `notes`.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat RELEASE_NOTES.md
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Second Brain Hub v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          releaseDraft: false
          prerelease: false
          # Each platform job would write latest.json and race the others (0.21.4 lost the arm64 entry). The manifest job below writes it once.
          uploadUpdaterJson: 'false'

  # Runs after every platform has uploaded its signed installer. Writes latest.json once,
  # so it lists all platforms (BACKLOG TD-16). Fails the run if any platform is missing.
  manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p sigs
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D sigs -p '*.sig'
          node scripts/make-updater-manifest.mjs sigs "$GITHUB_REPOSITORY" "$VERSION" RELEASE_NOTES.md > latest.json
          gh release upload "v$VERSION" latest.json -R "$GITHUB_REPOSITORY" --clobber
