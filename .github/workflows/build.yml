name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installers
            bundle-paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            artifact-name: macos-installer
            bundle-paths: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-paths }}

  # Separate job, not per-platform publishing — two parallel jobs racing to
  # create/update the same Release tag is exactly the kind of thing that
  # flakes. This one waits for both builds, then publishes a single Release
  # with both installers attached.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Actions' native artifact storage (productionresultssa8.blob.core.windows.net)
      # gets connection-reset on this network — likely a Zscaler-blocked Azure
      # endpoint. GitHub Release assets are served from a different domain, so
      # ship installers that way instead (this only affects the final
      # human-facing download; upload/download-artifact between jobs above is
      # server-to-server on GitHub's infra and unaffected).
      # Recursive globs (`**`), not `dist/<artifact>/*` — the Windows artifact
      # was uploaded from two path patterns (msi/*.msi, nsis/*.exe), so
      # actions/upload-artifact preserved the msi/ and nsis/ subdirectories
      # inside it (single-pattern uploads like macOS's don't have this
      # problem, which is why only the .dmg made it into build-1's release
      # and the Windows installers silently matched nothing).
      - name: Publish installers to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            dist/windows-installers/**/*.msi
            dist/windows-installers/**/*.exe
            dist/macos-installer/**/*.dmg
