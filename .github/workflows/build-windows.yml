name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (Windows)
        run: npm run tauri build

      # Actions' native artifact storage (productionresultssa8.blob.core.windows.net)
      # gets connection-reset on this network — likely a Zscaler-blocked Azure
      # endpoint. GitHub Release assets are served from a different domain, so
      # ship the installer that way instead.
      - name: Publish installer to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
